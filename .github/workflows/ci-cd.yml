name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # Throwaway values so the app builds and boots in CI. Real secrets live only on the VPS.
  DATABASE_URL: postgresql://morrow:morrow@localhost:5432/morrow?schema=public
  AUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
  AUTH_URL: http://localhost:3000
  AUTH_TRUST_HOST: "true"
  APP_URL: http://localhost:3000
  CRON_SECRET: ci-cron-secret
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint · Typecheck · Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Migrate · Build · Smoke test
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: morrow
          POSTGRES_PASSWORD: morrow
          POSTGRES_DB: morrow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U morrow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Check schema and migrations agree
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Build
        run: npm run build
      - name: Boot production server
        run: |
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          PORT=3000 MORROW_FIXTURES=1 node .next/standalone/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:3000/api/health && break; sleep 1; done
      - name: Smoke test routes
        run: |
          set -e
          curl -fs localhost:3000/api/health | grep -q '"database":"ok"'
          for p in / /signin /signup /forgot-password /favicon.ico; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "localhost:3000$p"); echo "$p → $code"; [ "$code" = "200" ]
          done
          # Protected pages redirect to sign-in; cron rejects missing secret
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/paper)" = "307" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/api/cron/daily)" = "401" ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CRON_SECRET" localhost:3000/api/cron/daily)" = "200" ]
      - name: Server log
        if: always()
        run: cat server.log || true

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    # Runs on pushes to main once you set the repository variable DEPLOY_ENABLED=true
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    steps:
      - name: Pull, migrate, build and reload on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          command_timeout: 20m
          script: |
            set -e
            cd "${{ secrets.VPS_APP_DIR }}"
            git fetch --all --prune
            git reset --hard "${{ github.sha }}"
            GIT_SHA="${{ github.sha }}" bash deploy/deploy.sh
      - name: Health check
        if: vars.APP_URL != ''
        run: |
          for i in $(seq 1 20); do
            curl -fs "${{ vars.APP_URL }}/api/health" | tee /dev/stderr | grep -q '"status":"ok"' && exit 0
            sleep 5
          done
          echo "Health check failed" && exit 1
