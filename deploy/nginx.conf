# /etc/nginx/sites-available/the-morrow  →  ln -s to sites-enabled, then: nginx -t && systemctl reload nginx
# TLS: certbot --nginx -d morrow.example.com
server {
    listen 80;
    server_name morrow.example.com;

    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 180s;   # printing a paper can take a little while
    }
}
